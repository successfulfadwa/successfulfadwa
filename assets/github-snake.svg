<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" role="img" aria-labelledby="snake-title snake-desc">
  <title id="snake-title">Contribution snake placeholder</title>
  <desc id="snake-desc">Run the GitHub Action Generate contribution snake to replace this with your animated contribution grid.</desc>
  <defs>
    <linearGradient id="p" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1a22"/>
      <stop offset="100%" stop-color="#2a2438"/>
    </linearGradient>
  </defs>
  <rect width="800" height="120" fill="url(#p)" rx="12"/>
  <text x="400" y="56" text-anchor="middle" fill="#c4b5fd" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600">Snake loads here</text>
  <text x="400" y="82" text-anchor="middle" fill="#9ca3af" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">Actions ’ Generate contribution snake ’ Run workflow</text>
</svg>
