<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="hT hD">
  <title id="hT">Platinum AI Tech Group LLC header</title>
  <desc id="hD">Aerospace HUD-style chrome title on a deep field grid with a frosted glass panel.</desc>
  <defs>
    <radialGradient id="field" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#030305"/>
    </radialGradient>
    <pattern id="pg" width="45" height="45" patternUnits="userSpaceOnUse">
      <rect width="45" height="45" fill="none"/>
      <path d="M45 0 V45 H0" fill="none" stroke="#1e293b" stroke-opacity="0.2" stroke-width="1"/>
      <circle cx="0" cy="0" r="1" fill="#334155" opacity="0.3"/>
      <circle cx="45" cy="0" r="1" fill="#334155" opacity="0.3"/>
      <circle cx="0" cy="45" r="1" fill="#334155" opacity="0.3"/>
      <circle cx="45" cy="45" r="1" fill="#334155" opacity="0.3"/>
    </pattern>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="25%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0"/>
      <stop offset="50%" stop-color="#475569" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#475569" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="frost" x="-2%" y="-2%" width="104%" height="104%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5"/>
    </filter>
    <filter id="titleGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
      <feFlood flood-color="#e2e8f0" flood-opacity="0.28" result="f"/>
      <feComposite in="f" in2="b" operator="in" result="g"/>
      <feMerge>
        <feMergeNode in="g"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <mask id="shineMask" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="300">
      <rect width="900" height="300" fill="#000"/>
      <text x="450" y="178" text-anchor="middle" font-family="Arial Black, Impact, Helvetica, sans-serif" font-size="74" font-weight="900" letter-spacing="10" fill="#fff">PLATINUM AI</text>
    </mask>
  </defs>
  <rect width="900" height="300" fill="url(#field)"/>
  <rect width="900" height="300" fill="url(#pg)" opacity="0.85"/>
  <circle cx="225" cy="120" r="1.6" fill="#334155" opacity="0.35">
    <animate attributeName="opacity" values="0.2;0.6;0.2" keyTimes="0;0.5;1" dur="3.2s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="405" cy="75" r="1.6" fill="#334155" opacity="0.35">
    <animate attributeName="opacity" values="0.2;0.6;0.2" keyTimes="0;0.5;1" dur="2.8s" repeatCount="indefinite" begin="0.4s"/>
  </circle>
  <circle cx="585" cy="195" r="1.6" fill="#334155" opacity="0.35">
    <animate attributeName="opacity" values="0.2;0.6;0.2" keyTimes="0;0.5;1" dur="3.6s" repeatCount="indefinite" begin="0.8s"/>
  </circle>
  <circle cx="720" cy="105" r="1.6" fill="#334155" opacity="0.35">
    <animate attributeName="opacity" values="0.2;0.6;0.2" keyTimes="0;0.5;1" dur="2.6s" repeatCount="indefinite" begin="1.1s"/>
  </circle>
  <circle cx="315" cy="210" r="1.6" fill="#334155" opacity="0.35">
    <animate attributeName="opacity" values="0.2;0.6;0.2" keyTimes="0;0.5;1" dur="3.0s" repeatCount="indefinite" begin="0.2s"/>
  </circle>
  <circle cx="495" cy="45" r="1.6" fill="#334155" opacity="0.35">
    <animate attributeName="opacity" values="0.2;0.6;0.2" keyTimes="0;0.5;1" dur="2.9s" repeatCount="indefinite" begin="1.4s"/>
  </circle>
  <g filter="url(#frost)">
    <rect x="100" y="60" width="700" height="180" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  </g>
  <rect x="104" y="64" width="692" height="172" rx="14" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="450" y="92" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="5" fill="#334155">PLATINUM AI TECH GROUP LLC  &#183;  EST. 2026</text>
  <text x="450" y="178" text-anchor="middle" font-family="Arial Black, Impact, Helvetica, sans-serif" font-size="74" font-weight="900" letter-spacing="10" fill="url(#titleGrad)" filter="url(#titleGlow)">PLATINUM AI</text>
  <g mask="url(#shineMask)">
    <rect x="-900" y="0" width="520" height="300" fill="url(#shineGrad)">
      <animateTransform attributeName="transform" type="translate" from="-900 0" to="1800 0" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <path d="M220 198 H680" stroke="url(#ruleGrad)" stroke-width="1"/>
  <text x="450" y="222" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="13" letter-spacing="6" fill="#64748b">FROM IDEA TO PRODUCTION</text>
  <path d="M48 48h22M48 48v22M852 48h-22M852 48v22M48 252h22M48 252v-22M852 252h-22M852 252v-22" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.5"/>
</svg>
